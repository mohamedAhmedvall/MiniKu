services:
  miniku:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://pxy-smi-user.somei.intranet:8080}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://pxy-smi-user.somei.intranet:8080}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,.somei.intranet}
    image: miniku:latest
    container_name: miniku
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-http://pxy-smi-user.somei.intranet:8080}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://pxy-smi-user.somei.intranet:8080}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,.somei.intranet}
      http_proxy: ${HTTP_PROXY:-http://pxy-smi-user.somei.intranet:8080}
      https_proxy: ${HTTPS_PROXY:-http://pxy-smi-user.somei.intranet:8080}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,.somei.intranet}
    ports:
      - "8501:8501"
    volumes:
      - .:/workspaces/MiniKu
    working_dir: /workspaces/MiniKu
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
